<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Start Page</title>
  <link rel="stylesheet" href="start.css">
    <link href="https://fonts.googleapis.com/css2?family=Varela+Round&display=swap" rel="stylesheet">
</head>
<body>

  <div class="browser">

    <!-- Tab strip -->
    <div class="tab-strip">
      <button type="button" class="tab active"><span class="fav fav-g">G</span> color</button>
      <button type="button" class="tab"><span class="fav fav-yt">▶</span> music</button>
      <button type="button" class="tab"><span class="fav fav-fb">f</span> facebook</button>
    </div>

    <!-- Toolbar -->
    <div class="toolbar">
      <button type="button" class="nav-btn" aria-label="Back">←</button>
      <button type="button" class="nav-btn" aria-label="Forward">→</button>
      <button type="button" class="nav-btn" aria-label="Reload">⟳</button>


 <a href="index.html" class="active">Home</a>
  

      <div class="address-bar">
        <span class="fav fav-g">G</span>
        <input type="text" id="address" aria-label="Address bar">
      </div>

      <span class="avatar" aria-hidden="true"></span>
      <button type="button" class="menu-btn" aria-label="Menu">⋮</button>
    </div>

    <!-- Page area (filled in the next steps) -->
    <main class="page">
            <main class="page">

      <header class="page-top">
        <a href="" target="_blank" rel="noopener">Gmail</a>
        <a href="https://www.google.com/imghp" target="_blank" rel="noopener">Images</a>

        <button type="button" class="apps-btn" aria-label="Apps">
          <span></span><span></span><span></span>
          <span></span><span></span><span></span>
          <span></span><span></span><span></span>
        </button>

        <span class="avatar" aria-hidden="true"></span>
      </header>
            <section class="search-area">

        <h1 class="logo" aria-label="Google">
          <span class="g-blue">G</span><span class="g-red">o</span><span class="g-yellow">o</span><span class="g-blue">g</span><span class="g-green">l</span><span class="g-red">e</span>
        </h1>

        <form class="search-form" action="https://www.google.com/search" method="get" target="_blank" role="search">
          <button type="button" class="plus-btn" aria-label="Add">+</button>
          <input type="search" name="q" id="searchInput" placeholder="Ask Google" aria-label="Search" autocomplete="off">
          <button type="button" class="tool-btn" aria-label="Search by voice">🎤</button>
          <button type="button" class="tool-btn" aria-label="Search by image">📷</button>
          <button type="submit" class="ai-btn">✨ AI Mode</button>
        </form>
        <nav class="shortcuts" aria-label="Shortcuts">
          <ul>

            <li>
              <a href="https://www.youtube.com" target="_blank" rel="noopener" class="shortcut">
                <span class="sc-icon sc-yt" aria-hidden="true">▶</span>
                <span>youtube</span>
              </a>
            </li>

            <li>
              <a href="https://web.whatsapp.com" target="_blank" rel="noopener" class="shortcut">
                <span class="sc-icon sc-wa" aria-hidden="true">✆</span>
                <span>whatsapp</span>
              </a>
            </li>

            <li>
              <a href="https://www.figma.com" target="_blank" rel="noopener" class="shortcut">
                <span class="sc-icon sc-fg" aria-hidden="true">F</span>
                <span>figma</span>
                <a href="contact.html">Contact</a>
              </a>
            </li>

            <li>
              <a href="https://www.google.com" target="_blank" rel="noopener" class="shortcut">
                <span class="sc-icon sc-g" aria-hidden="true">G</span>
                <span>Google</span>
              </a>
            </li>

            <li>
              <a href="https://github.com" target="_blank" rel="noopener" class="shortcut">
                <span class="sc-icon sc-gh" aria-hidden="true">GH</span>
                <span>Github</span>
              </a>
            </li>

            <li>
              <a href="https://chatgpt.com" target="_blank" rel="noopener" class="shortcut">
                <span class="sc-icon sc-ai" aria-hidden="true">✱</span>
                <span>Chatgpt</span>
              </a>
            </li>

            <li>
              <a href="#" class="shortcut">
                <span class="sc-icon sc-school" aria-hidden="true">🏫</span>
