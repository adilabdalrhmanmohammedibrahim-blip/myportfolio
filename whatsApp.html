        <!-- Floating Chat Elements -->
        <div class="chat-container">
            <!-- Person 1 Top Center -->
            <img class="avatar avatar-1" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=100&q=80" alt="User 1">
            <div class="chat-bubble bubble-top">
                <span>Hello!</span>
                <span class="timestamp">11:59</span>
            </div>

            <!-- Person 2 Left -->
            <img class="avatar avatar-2" src="https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=100&q=80" alt="User 2">

                <span>مضحك جداً</span>
                <span class="timestamp">11:59</span>
            </div>

            <img class="avatar avatar-3" src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=100&q=80" alt="User 3">
            <div class="chat-bubble bubble-right">
                <span>Hallo</span>
            </div>
        </div>

        <!-- Main Headline -->
        <h1 class="hero-text">
            With private messaging and calling, you can be yourself, speak freely and feel close to the most important people in your life no matter where they are.
        </h1>
