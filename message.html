<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign Up - TechBlog</title>
  <link rel="stylesheet" href="message.css">
</head>
<body>

  <div class="signup-page">

    <!-- LEFT: photo -->
    <section class="signup-photo">
      <img src="Screenshot from 2026-10-01 17-14-38.png" alt="">
    </section>

    <!-- RIGHT: navigation and form -->
    <section class="signup-right">

      <header class="signup-nav">
        <nav class="nav-links">
          <a href="index.html" class="active">Home</a>
    <a href="about.html">About</a>
    <a href="dashboard.html">Blog</a>
    <a href="skills.html">Skills</a>
    <a href="projects.html">Project</a>
    <a href="contact.html">Contact</a>
   
        </nav>
      </header>

      <div class="form-wrap">
        <h1>Message Me</h1>
        <p class="sub">Access your blog, manage your posts, and be part of our growing community.</p>

        <form id="signupForm" novalidate>

          <div class="field">
            <span class="field-icon" aria-hidden="true">👤</span>
            <input type="text" id="fullName" placeholder="Full Name" aria-label="Full name" autocomplete="name" required>
          </div>

          <div class="field">
            <span class="field-icon" aria-hidden="true">✉️</span>
            <input type="email" id="email" placeholder="Email address" aria-label="Email address" autocomplete="email" required>
          </div>

         
         
        </form>

        

        <button type="button" class="btn-google">
          <span class="g">message</span>
        </button>

              </div>

    </section>

  </div>
<script src="auth.js"></script>

</body>
</html>
